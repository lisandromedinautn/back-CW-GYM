# Bases de datos del proyecto (decisión 21: la base de test es independiente y dockerizada).
# Se usan los puertos 5442 y 5443 para no chocar con otros Postgres locales.
#   yarn bd:levantar   levanta las dos
#   yarn bd:bajar      las detiene (los datos de desarrollo quedan en el volumen)

name: cw-gym

services:
  bd-desarrollo:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: gimnasio
      POSTGRES_PASSWORD: gimnasio
      POSTGRES_DB: gimnasio_desarrollo
    ports:
      - '5442:5432'
    volumes:
      - datos-desarrollo:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gimnasio -d gimnasio_desarrollo']
      interval: 2s
      timeout: 3s
      retries: 15

  bd-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: gimnasio
      POSTGRES_PASSWORD: gimnasio
      POSTGRES_DB: gimnasio_test
    ports:
      - '5443:5432'
    # En memoria: cada `bd:levantar` arranca con la base de test vacía.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gimnasio -d gimnasio_test']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  datos-desarrollo:
